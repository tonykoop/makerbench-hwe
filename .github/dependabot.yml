# Keeps the reproducibility-critical toolchain from quietly rotting:
# GitHub Actions (pinned by major tag) and the locked Python grading env.
# Refs #513.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
