name: verify-private-submission

# True zero-public-exposure result verification for issue #13.
#
# The public PR contains metadata-only result JSON. Source artifacts are supplied
# out-of-band into the PRIVATE makerbench-submissions repo under:
#
#   incoming/hwe-pr-<PR>/results/<model>/artifacts/<artifact>
#
# A maintainer runs this workflow. It checks out the public PR, clones the private
# submissions repo with SUBMISSIONS_DEPLOY_KEY, regrades the public result JSON
# using the private artifact files, archives those files into canonical private
# storage, and posts a trusted attestation comment back to the PR. Public CI then
# verifies that comment without ever seeing the source artifacts.

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Submission PR number."
        required: true
        type: string
      submissions_ref:
        description: "Private makerbench-submissions ref containing incoming artifacts."
        required: false
        default: "main"
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  verify-private:
    runs-on: ubuntu-latest
    env:
      SUBMISSIONS_DEPLOY_KEY: ${{ secrets.SUBMISSIONS_DEPLOY_KEY }}
      GH_TOKEN: ${{ github.token }}
      PR: ${{ inputs.pr }}
      SUBMISSIONS_REF: ${{ inputs.submissions_ref }}
    steps:
      - name: Validate inputs and secret
        run: |
          set -euo pipefail
          if ! [[ "$PR" =~ ^[0-9]+$ ]]; then
            echo "::error::pr input must be a positive integer (got '$PR')."
            exit 1
          fi
          if [ -z "$SUBMISSIONS_DEPLOY_KEY" ]; then
            echo "::error::SUBMISSIONS_DEPLOY_KEY is not set."
            exit 1
          fi

      - name: Resolve PR head and base
        id: pr
        run: |
          set -euo pipefail
          gh pr view "$PR" --repo "${{ github.repository }}" \
            --json headRefOid,baseRefName \
            --jq '"sha=\(.headRefOid)\nbase=\(.baseRefName)"' >> "$GITHUB_OUTPUT"

      - name: Check out public metadata-only PR
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Fetch base ref
        # checkout ran with persist-credentials:false (no token left in
        # .git/config for PR-authored harness code to read), so authenticate
        # this one fetch inline with an in-memory token. Works whether the repo
        # is private (pre-launch) or public.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          # Full history (not --depth=1): the regrade discovers changed bundles
          # with `git diff <base>...HEAD`, whose merge-base must be present. This
          # job checks out the PR head sha directly (no pull_request merge ref),
          # so a shallow base has no common ancestor with HEAD and the diff fails.
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch origin "${{ steps.pr.outputs.base }}"

      - name: Install OpenSCAD
        run: sudo apt-get update && sudo apt-get install -y openscad

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install locked grading environment
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e ".[dev]"

      - name: Clone private submissions archive
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SUBMISSIONS_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes"
          git clone git@github.com:${{ github.repository_owner }}/makerbench-submissions.git _submissions
          git -C _submissions checkout "$SUBMISSIONS_REF"

      - name: Archive incoming private artifacts canonically
        id: archive
        run: |
          set -euo pipefail
          incoming="_submissions/incoming/hwe-pr-${PR}"
          if [ ! -d "$incoming/results" ]; then
            echo "::error::No private incoming artifacts found at $incoming/results"
            exit 1
          fi

          mapfile -t artifacts < <(find "$incoming/results" -type f | sort)
          if [ "${#artifacts[@]}" -eq 0 ]; then
            echo "::error::No private artifacts found under $incoming/results"
            exit 1
          fi

          for f in "${artifacts[@]}"; do
            rel="${f#${incoming}/}"
            if ! [[ "$rel" =~ ^results/[^/]+/artifacts/[^/]+$ ]]; then
              echo "::error::Unexpected private artifact path: $rel"
              exit 1
            fi
            model=$(echo "$rel" | sed -E 's#^results/([^/]+)/artifacts/.*#\1#')
            name=$(basename "$rel")
            stem="${name%.*}"
            ext="${name##*.}"
            dest="_submissions/submissions/$model/$stem"
            mkdir -p "$dest"
            cp "$f" "$dest/source.$ext"
            sha=$(sha256sum "$f" | cut -d' ' -f1)
            # Emit the full v2 meta.json contract directly (filename-derived
            # task/seed/track/source_ext + public grade fields). The submissions
            # repo validates these with scripts/validate_archive.py; this removes
            # the need for a post-archive backfill_meta.py bridge.
            python scripts/emit_submission_meta.py \
              --model "$model" \
              --source-file "$name" \
              --sha256 "$sha" \
              --pr "$PR" \
              --source-commit "${{ steps.pr.outputs.sha }}" \
              --incoming-path "$rel" \
              --results-root results > "$dest/meta.json"
          done

          cd _submissions
          git config user.name "makerbench-archive-bot"
          git config user.email "noreply@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "::notice::Private archive already up to date."
          else
            git commit -m "archive: private submission artifacts for makerbench-hwe#${PR} (${{ steps.pr.outputs.sha }})"
            git push origin HEAD:"$SUBMISSIONS_REF"
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Regrade from private artifacts and write attestation
        run: |
          set -euo pipefail
          makerbench regrade-results \
            --base "origin/${{ steps.pr.outputs.base }}" \
            --private-artifact-root "_submissions/incoming/hwe-pr-${PR}" \
            --attestation-out "_attestation.json" \
            --attestation-repo "${{ github.repository }}" \
            --attestation-pr "$PR" \
            --archive-commit "${{ steps.archive.outputs.commit }}" \
            --archive-ref "$SUBMISSIONS_REF"

      - name: Comment trusted attestation on the PR
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from makerbench.attestation import format_attestation_comment

          attestation = json.loads(Path("_attestation.json").read_text(encoding="utf-8"))
          Path("_attestation_comment.md").write_text(
              format_attestation_comment(attestation),
              encoding="utf-8",
          )
          PY
          gh pr comment "$PR" --repo "${{ github.repository }}" --body-file _attestation_comment.md
